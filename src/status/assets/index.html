<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <title>Zen Proxy Status</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2310a37f'/><text x='16' y='22' text-anchor='middle' font-size='18' fill='white'>⚡</text></svg>">
</head>
<body class="status index">
  <div class="layout-content status status-index">

    <!-- Masthead -->
    <div class="masthead-container basic">
      <div class="masthead has-logo">
        <div class="logo-container">
          <div class="logo-mark" aria-hidden="true">⚡</div>
        </div>
        <div class="masthead-text">
          <h1>Zen Proxy</h1>
        </div>
      </div>
    </div>

    <div class="container">

      <!-- Overall status banner -->
      <div id="statusBanner" class="page-status status-none">
        <span class="status font-large" id="bannerTitle">Awaiting Data…</span>
        <span class="last-updated-stamp font-small" id="lastSync"></span>
      </div>

      <!-- Components section -->
      <div class="components-section font-regular">
        <div class="components-uptime-link history-footer-link" id="uptimeNote">
          Uptime over the past <span id="uptimeDays">90</span> days.
        </div>
        <div class="components-container one-column" id="models">
          <div class="component-container border-color">
            <div class="component-inner-container status-green showcased" data-component-status="unknown">
              <span class="name muted">No model data yet</span>
            </div>
          </div>
        </div>
        <div class="component-statuses-legend font-small">
          <div class="legend-item status-green">
            <span class="icon-indicator fa fa-check">✓</span> Operational
          </div>
          <div class="legend-item status-blue">
            <span class="icon-indicator fa fa-wrench">●</span> Keyed (Degraded)
          </div>
          <div class="legend-item status-red">
            <span class="icon-indicator fa fa-times">✕</span> Major Outage
          </div>
          <div class="legend-item status-gray">
            <span class="icon-indicator">○</span> Unknown
          </div>
        </div>
      </div>

      <!-- Past Incidents / Activity -->
      <div class="incidents-list format-expanded" id="incidentsSection">
        <a class="font-largest no-link" id="past-incidents">Past Activity</a>
        <div id="incidentsContent"></div>
      </div>

    </div>

    <div class="page-footer border-color font-small">
      <span class="color-secondary powered-by">Powered by Zen Proxy · Data refreshes every 5 seconds</span>
    </div>

  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
