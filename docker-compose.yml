services:
  zenproxy:
    build: .
    image: ghcr.io/${GHCR_OWNER:-your-ghcr-owner}/${GHCR_IMAGE:-zen-proxy}:latest
    container_name: zenproxy
    restart: unless-stopped
    ports:
      - "${LISTEN_PORT:-8080}:8080"
    env_file:
      - .env

  # 独立于反代后端的 Status UI：只通过 HTTP 探测代理与上游。
  # 绿=匿名调用成功；蓝=仅 API Key 调用成功；红=全部调用失败。
  status-ui:
    image: ghcr.io/${GHCR_OWNER:-your-ghcr-owner}/${GHCR_IMAGE:-zen-proxy}:latest
    container_name: status-ui
    restart: unless-stopped
    entrypoint: /usr/local/bin/status-ui
    ports:
      - "${STATUS_UI_PORT:-8090}:8090"
    environment:
      STATUS_PROXY: http://zenproxy:8080
      STATUS_UPSTREAM: "${STATUS_UPSTREAM:-https://opencode.ai/zen}"
      STATUS_API_KEY: "${STATUS_API_KEY:-}"
      STATUS_PROXY_AUTH: "${ZEN_AUTH_KEY:-}"
      STATUS_MODELS: "${STATUS_MODELS:-}"
      STATUS_INTERVAL: "${STATUS_INTERVAL:-15}"
    env_file:
      - .env
