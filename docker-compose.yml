services:
  zenproxy:
    build: .
    image: ghcr.io/${GHCR_OWNER:-as214933}/${GHCR_IMAGE:-oc-fwd}:latest
    container_name: zenproxy
    restart: unless-stopped
    ports:
      - "${LISTEN_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # 模型切换状态上报到 Status UI（.env 中 ZEN_STATUS_URL 可覆盖）
      ZEN_STATUS_URL: "${ZEN_STATUS_URL:-http://status-ui:8090}"

  # 独立于反代后端的 Status UI：接收反代上报的模型状态切换，并定期校准。
  # 绿=匿名模式运行中；蓝=已切换 API Key；红=API Key 也失败（全部失败）。
  status-ui:
    build: .
    image: ghcr.io/${GHCR_OWNER:-as214933}/${GHCR_IMAGE:-oc-fwd}:latest
    container_name: status-ui
    restart: unless-stopped
    entrypoint: /usr/local/bin/status-ui
    depends_on:
      - zenproxy
    ports:
      - "${STATUS_UI_PORT:-8090}:8090"
    environment:
      STATUS_PROXY: http://zenproxy:8080
      STATUS_PROXY_AUTH: "${ZEN_AUTH_KEY:-}"
      STATUS_EVENT_TOKEN: "${ZEN_STATUS_TOKEN:-}"
      STATUS_INTERVAL: "${STATUS_INTERVAL:-15}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
